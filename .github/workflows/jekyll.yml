name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✨ 彻底解决：不再下载那个挂掉的 ruby/setup-ruby 组件
      # 直接用 Ubuntu 系统自带的 Ruby 环境，并当场配置好权限，速度极快且100%不会断网
      - name: Use System Ruby and Fix Permissions
        run: |
          sudo chown -R $USER /var/lib/gems /usr/local/bin
          echo "GEM_HOME=$HOME/.gem" >> $GITHUB_ENV
          echo "PATH=$HOME/.gem/bin:$PATH" >> $GITHUB_ENV

      # 强制重构 Gemfile，死锁安全版本，彻底根除 1.100.0 的编译 Bug
      - name: Nuke and Rebuild Gemfile
        run: |
          rm -f Gemfile Gemfile.lock
          printf "source 'https://rubygems.org'\ngem 'jekyll', '~> 4.4.1'\ngem 'sass-embedded', '1.83.0'\ngem 'jekyll-sass-converter', '3.0.0'\ngem 'jekyll-paginate'\ngem 'jekyll-feed'\ngem 'jekyll-seo-tag'\n" > Gemfile

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
